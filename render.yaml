# Render Blueprint for the backend API (Dashboard -> New -> Blueprint -> pick this repo).
# The frontend is deployed separately on Vercel. Paths are relative to the repo root.
services:
  - type: web
    name: signal-clone-api
    runtime: docker
    rootDir: backend # only changes under backend/ trigger a redeploy
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # A persistent disk needs a paid instance; on the free plan SQLite would be wiped on every
    # deploy/restart and the service sleeps when idle (which drops every WebSocket).
    plan: starter
    region: singapore
    numInstances: 1 # WebSocket connections live in process memory: keep a single instance
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: signal-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/signal.db
      - key: CORS_ORIGINS # your Vercel URL, e.g. https://signal-clone.vercel.app
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIXED_OTP
        value: "123456"
      - key: SESSION_DAYS
        value: "30"
      - key: AUTO_SEED
        value: "true"
