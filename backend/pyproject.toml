[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`"]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the alembic package as first-party.
known-third-party = ["alembic"]
